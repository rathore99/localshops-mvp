<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalShops | Shop dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1 class="title">Bharat Kirana</h1>
        <p class="subtitle">Dashboard · 18 active reservations</p>
      </div>
      <a class="button" href="#">Add product</a>
    </header>

    <section class="card">
      <div class="section-title">Pending reservations</div>
      <div class="reservation-card">
        <strong>Sunita</strong>
        <p class="small-text">Item: Wheat flour, Oil</p>
        <p class="small-text">Pickup time: Today 4:00 PM</p>
        <a class="button button-secondary" href="#">Confirm</a>
      </div>
      <div class="reservation-card">
        <strong>Rajesh</strong>
        <p class="small-text">Item: Men’s shirt</p>
        <p class="small-text">Pickup time: Today 6:30 PM</p>
        <a class="button button-secondary" href="#">Confirm</a>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Subscription status</div>
      <p class="small-text">Active until: 30 April 2026</p>
      <a class="button button-secondary" href="#">Renew subscription</a>
    </section>
  </main>
</body>
</html>
