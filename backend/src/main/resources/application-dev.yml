server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:localshops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Allow all localhost Vite ports (5173–5175) — Vite auto-increments if port is taken
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175

logging:
  level:
    org.hibernate.SQL: DEBUG
