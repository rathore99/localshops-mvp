server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:localshops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    org.hibernate.SQL: DEBUG
